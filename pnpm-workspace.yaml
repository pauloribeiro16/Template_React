packages:
  - "frontend"
  - "backend"

# pnpm >= 10 não corre scripts de instalação sem autorização explícita.
# Estes pacotes precisam de o fazer para trazer binários (esbuild, prisma engines).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@tailwindcss/oxide": true
